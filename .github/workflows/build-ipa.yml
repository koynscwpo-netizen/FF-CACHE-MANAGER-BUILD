name: Check iOS SDK

on:
  workflow_dispatch:

jobs:
  check-sdk:
    runs-on: macos-15

    steps:
      - name: Check Xcode and iOS SDK
        run: |
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK: $SDK"
          xcrun --sdk iphoneos --show-sdk-version
          test -f "$SDK/System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"
          echo "UIKit SDK OK"
