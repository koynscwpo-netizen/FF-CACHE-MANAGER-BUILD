name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -e

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          xcodebuild -version
          xcodebuild -showsdks

      - name: Get iPhoneOS SDK
        shell: bash
        run: |
          set -e

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "IOS_SDK=$SDK" >> "$GITHUB_ENV"

          echo "======================================"
          echo "iPhoneOS SDK"
          echo "======================================"
          echo "$SDK"

          test -f "$SDK/System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"

          echo "UIKit/UIKit.h found successfully."

      - name: Find project root
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCH BUILD-WINDOWS.ps1"
          echo "======================================"

          SCRIPT="$(find . -type f -name 'BUILD-WINDOWS.ps1' -print -quit)"

          if [ -z "$SCRIPT" ]; then
            echo "BUILD-WINDOWS.ps1 was not found."
            exit 1
          fi

          SCRIPT="${SCRIPT#./}"
          PROJECT_ROOT="$(dirname "$SCRIPT")"

          echo "BUILD SCRIPT:"
          echo "$SCRIPT"

          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"

          if [ ! -f "$PROJECT_ROOT/app/ff_manager/build.ps1" ]; then
            echo "build.ps1 was not found:"
            echo "$PROJECT_ROOT/app/ff_manager/build.ps1"
            exit 1
          fi

          echo "BUILD_SCRIPT=$GITHUB_WORKSPACE/$SCRIPT" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$GITHUB_WORKSPACE/$PROJECT_ROOT/release" >> "$GITHUB_ENV"

          echo "======================================"
          echo "BUILD SCRIPT FOUND"
          echo "======================================"

          echo "$GITHUB_WORKSPACE/$SCRIPT"

          echo "======================================"
          echo "BUILD.PS1 FOUND"
          echo "======================================"

          echo "$GITHUB_WORKSPACE/$PROJECT_ROOT/app/ff_manager/build.ps1"

      - name: Install build tools
        shell: bash
        run: |
          set -e

          brew update
          brew install llvm sevenzip

            - name: Prepare tool names for build.ps1
        shell: bash
        run: |
          set -e

          TOOLS="$PROJECT_ROOT/app/ff_manager/.tools"

          mkdir -p "$TOOLS"

          LLVM="$(brew --prefix llvm)/bin"

          CLANG="$LLVM/clang"
          STRIP="$LLVM/llvm-strip"

          LD="$(xcrun --find ld)"
          LIPO="$(xcrun --find lipo)"
          INSTALL_NAME="$(xcrun --find install_name_tool)"
          SEVENZIP="$(command -v 7zz)"

          test -f "$CLANG"
          test -f "$STRIP"
          test -f "$LD"
          test -f "$LIPO"
          test -f "$INSTALL_NAME"
          test -f "$SEVENZIP"

          ln -sf "$CLANG" "$TOOLS/clang.exe"
          ln -sf "$STRIP" "$TOOLS/llvm-strip.exe"
          ln -sf "$LD" "$TOOLS/ld64.lld.exe"
          ln -sf "$LIPO" "$TOOLS/llvm-lipo.exe"
          ln -sf "$INSTALL_NAME" "$TOOLS/llvm-install-name-tool.exe"
          ln -sf "$SEVENZIP" "$TOOLS/7z.exe"

          chmod +x "$TOOLS"/*

          echo "$TOOLS" >> "$GITHUB_PATH"

          echo "======================================"
          echo "LLVM STRIP"
          echo "======================================"

          "$STRIP" --version

          echo "llvm-strip.exe is ready."

          TOOLS="$PROJECT_ROOT/app/ff_manager/.tools"

          mkdir -p "$TOOLS"

          LLVM="$(brew --prefix llvm)/bin"

          CLANG="$LLVM/clang"
          LD="$(xcrun --find ld)"
          LIPO="$(xcrun --find lipo)"
          INSTALL_NAME="$(xcrun --find install_name_tool)"
          STRIP="$(xcrun --find strip)"
          SEVENZIP="$(command -v 7zz)"

          test -f "$CLANG"
          test -f "$LD"
          test -f "$LIPO"
          test -f "$INSTALL_NAME"
          test -f "$STRIP"
          test -f "$SEVENZIP"

          ln -sf "$CLANG" "$TOOLS/clang.exe"
          ln -sf "$LD" "$TOOLS/ld64.lld.exe"
          ln -sf "$LIPO" "$TOOLS/llvm-lipo.exe"
          ln -sf "$INSTALL_NAME" "$TOOLS/llvm-install-name-tool.exe"
          ln -sf "$STRIP" "$TOOLS/llvm-strip.exe"
          ln -sf "$SEVENZIP" "$TOOLS/7z.exe"

          chmod +x "$TOOLS"/*

          # Make the .tools directory available to every later GitHub Actions step
          echo "$TOOLS" >> "$GITHUB_PATH"

          echo "======================================"
          echo "BUILD TOOLS"
          echo "======================================"

          ls -l "$TOOLS"

          echo "======================================"
          echo "7-ZIP CHECK"
          echo "======================================"

          "$TOOLS/7z.exe" --help >/dev/null

          echo "7z.exe is working."

      - name: Install Python dependency
        shell: bash
        run: |
          set -e

          python3 -m venv "$GITHUB_WORKSPACE/.venv"

          . "$GITHUB_WORKSPACE/.venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install lief

          echo "======================================"
          echo "PYTHON"
          echo "======================================"

          python --version

          echo "======================================"
          echo "LIEF"
          echo "======================================"

          python -c "import lief; print(lief.__version__)"

      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROJECT"
          echo "======================================"

          echo "PROJECT_ROOT:"
          echo "$PROJECT_ROOT"

          echo "BUILD_SCRIPT:"
          echo "$BUILD_SCRIPT"

          echo "RELEASE_DIR:"
          echo "$RELEASE_DIR"

          test -f "$BUILD_SCRIPT"
          test -f "$PROJECT_ROOT/app/ff_manager/build.ps1"

          echo "BUILD-WINDOWS.ps1 found."
          echo "build.ps1 found."

          echo "======================================"
          echo "7-ZIP PATH CHECK"
          echo "======================================"

          echo "$PATH"

          command -v 7z.exe

          echo "7z.exe found in PATH."

          echo "======================================"
          echo "PROJECT CONTENTS"
          echo "======================================"

          ls -la "$PROJECT_ROOT"

          echo "======================================"
          echo "APP CONTENTS"
          echo "======================================"

          ls -la "$PROJECT_ROOT/app/ff_manager"

      - name: Build unsigned IPA
        shell: pwsh
        env:
          IOS_SDK: ${{ env.IOS_SDK }}
          PROJECT_ROOT: ${{ env.PROJECT_ROOT }}
          BUILD_SCRIPT: ${{ env.BUILD_SCRIPT }}
          RELEASE_DIR: ${{ env.RELEASE_DIR }}
          FF_TOOLS_ROOT: ${{ env.PROJECT_ROOT }}/app/ff_manager/.tools
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "======================================"
          Write-Host "FF Cache Manager IPA Build"
          Write-Host "======================================"

          Write-Host "PROJECT_ROOT:"
          Write-Host $env:PROJECT_ROOT

          Write-Host "BUILD_SCRIPT:"
          Write-Host $env:BUILD_SCRIPT

          Write-Host "IOS_SDK:"
          Write-Host $env:IOS_SDK

          Write-Host "FF_TOOLS_ROOT:"
          Write-Host $env:FF_TOOLS_ROOT

          Write-Host "PYTHON:"
          Write-Host $env:PYTHON

          Write-Host "7-ZIP:"
          Get-Command 7z.exe | Format-List

          $UIKitHeader = Join-Path `
            $env:IOS_SDK `
            "System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"

          if (-not (Test-Path -LiteralPath $UIKitHeader)) {
              throw "UIKit/UIKit.h was not found."
          }

          if (-not (Test-Path -LiteralPath $env:BUILD_SCRIPT)) {
              throw "BUILD-WINDOWS.ps1 was not found."
          }

          if (-not (Test-Path -LiteralPath "$env:PROJECT_ROOT/app/ff_manager/build.ps1")) {
              throw "app/ff_manager/build.ps1 was not found."
          }

          Write-Host "UIKit/UIKit.h found."
          Write-Host "BUILD-WINDOWS.ps1 found."
          Write-Host "build.ps1 found."
          Write-Host "7z.exe found."

          New-Item -ItemType Directory -Force -Path $env:RELEASE_DIR | Out-Null

          & $env:BUILD_SCRIPT `
            -IosSdk "$env:IOS_SDK" `
            -OutputDirectory "$env:RELEASE_DIR"

          if ($LASTEXITCODE -ne 0) {
              throw "IPA build failed with exit code $LASTEXITCODE"
          }

      - name: Show generated files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "RELEASE FILES"
          echo "======================================"

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "Release directory was not created:"
            echo "$RELEASE_DIR"
            exit 1
          fi

          find "$RELEASE_DIR" -maxdepth 3 -type f -print

          echo "======================================"
          echo "IPA FILES"
          echo "======================================"

          find "$RELEASE_DIR" -type f -name "*.ipa" -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FF-Cache-Manager-IPA
          path: ${{ env.RELEASE_DIR }}/*.ipa
          if-no-files-found: error
