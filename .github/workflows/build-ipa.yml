name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Get iPhoneOS SDK
        shell: bash
        run: |
          set -e

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "IOS_SDK=$SDK" >> "$GITHUB_ENV"

          echo "iPhoneOS SDK:"
          echo "$SDK"

          test -f "$SDK/System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"

          echo "UIKit/UIKit.h found successfully."

      - name: Install build tools
        shell: bash
        run: |
          set -e

          brew update
          brew install llvm sevenzip

      - name: Prepare tool names for build.ps1
        shell: bash
        run: |
          set -e

          mkdir -p app/ff_manager/.tools

          LLVM="$(brew --prefix llvm)/bin"

          CLANG="$LLVM/clang"
          LD="$(xcrun --find ld)"
          LIPO="$(xcrun --find lipo)"
          INSTALL_NAME="$(xcrun --find install_name_tool)"
          STRIP="$(xcrun --find strip)"
          SEVENZIP="$(command -v 7zz)"

          test -f "$CLANG"
          test -f "$LD"
          test -f "$LIPO"
          test -f "$INSTALL_NAME"
          test -f "$STRIP"
          test -f "$SEVENZIP"

          ln -sf "$CLANG" \
            app/ff_manager/.tools/clang.exe

          ln -sf "$LD" \
            app/ff_manager/.tools/ld64.lld.exe

          ln -sf "$LIPO" \
            app/ff_manager/.tools/llvm-lipo.exe

          ln -sf "$INSTALL_NAME" \
            app/ff_manager/.tools/llvm-install-name-tool.exe

          ln -sf "$STRIP" \
            app/ff_manager/.tools/llvm-strip.exe

          ln -sf "$SEVENZIP" \
            app/ff_manager/.tools/7z.exe

          chmod +x app/ff_manager/.tools/*

          echo "===== BUILD TOOLS ====="
          ls -l app/ff_manager/.tools

      - name: Install Python dependency
        shell: bash
        run: |
          set -e

          python3 -m venv .venv

          . .venv/bin/activate

          python -m pip install --upgrade pip
          python -m pip install lief

          echo "Python:"
          python --version

          echo "LIEF:"
          python -c "import lief; print(lief.__version__)"

      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROJECT ROOT"
          echo "======================================"

          pwd
          ls -la

          echo "======================================"
          echo "BUILD-WINDOWS.ps1"
          echo "======================================"

          test -f "./BUILD-WINDOWS.ps1"
          echo "BUILD-WINDOWS.ps1 found."

          echo "======================================"
          echo "build.ps1"
          echo "======================================"

          test -f "./app/ff_manager/build.ps1"
          echo "app/ff_manager/build.ps1 found."

          echo "======================================"
          echo "TOOLS"
          echo "======================================"

          ls -la ./app/ff_manager/.tools

      - name: Build unsigned IPA
        shell: pwsh
        env:
          IOS_SDK: ${{ env.IOS_SDK }}
          FF_TOOLS_ROOT: ${{ github.workspace }}/app/ff_manager/.tools
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "======================================"
          Write-Host "FF Cache Manager IPA Build"
          Write-Host "======================================"

          Write-Host "Current directory:"
          Get-Location

          Write-Host "IOS_SDK:"
          Write-Host $env:IOS_SDK

          Write-Host "FF_TOOLS_ROOT:"
          Write-Host $env:FF_TOOLS_ROOT

          Write-Host "PYTHON:"
          Write-Host $env:PYTHON

          $UIKitHeader = Join-Path `
            $env:IOS_SDK `
            "System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"

          if (-not (Test-Path -LiteralPath $UIKitHeader)) {
              throw "UIKit/UIKit.h was not found."
          }

          Write-Host "UIKit/UIKit.h found."

          if (-not (Test-Path -LiteralPath "./BUILD-WINDOWS.ps1")) {
              throw "BUILD-WINDOWS.ps1 was not found in repository root."
          }

          Write-Host "BUILD-WINDOWS.ps1 found."

          if (-not (Test-Path -LiteralPath "./app/ff_manager/build.ps1")) {
              throw "app/ff_manager/build.ps1 was not found."
          }

          Write-Host "app/ff_manager/build.ps1 found."

          & ./BUILD-WINDOWS.ps1 `
            -IosSdk "$env:IOS_SDK" `
            -OutputDirectory "./release"

          if ($LASTEXITCODE -ne 0) {
              throw "IPA build failed with exit code $LASTEXITCODE"
          }

      - name: Show generated files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "RELEASE FILES"
          echo "======================================"

          if [ ! -d "./release" ]; then
            echo "release directory was not created."
            exit 1
          fi

          find ./release -maxdepth 2 -type f -print

          echo "======================================"
          echo "IPA FILES"
          echo "======================================"

          find ./release -type f -name "*.ipa" -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FF-Cache-Manager-IPA
          path: release/*.ipa
          if-no-files-found: error
