name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and iOS SDK
        run: |
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK=$SDK"
          xcrun --sdk iphoneos --show-sdk-version
          test -f "$SDK/System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"
          echo "UIKit SDK OK"

      - name: Install Python dependency
        run: |
          python3 -m pip install lief

      - name: List project
        run: |
          find . -maxdepth 4 -type f | sort

      - name: Build
        shell: pwsh
        run: |
          $env:IOS_SDK = (xcrun --sdk iphoneos --show-sdk-path)
          ./BUILD-WINDOWS.ps1

      - name: Find IPA
        run: |
          find . -type f -name "*.ipa" -print
